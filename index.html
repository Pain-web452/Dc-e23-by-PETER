<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Messenger Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #ffe6f2; padding: 20px; display: flex; justify-content: center; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; color: #444; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        input[type="file"] { padding: 5px; background: #fff; }
        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-submit { background-color: #ff3366; color: white; }
        .btn-task { background-color: #3366ff; color: white; width: 48%; }
        .btn-stop { background-color: #ff3333; color: white; width: 48%; }
        .flex-buttons { display: flex; justify-content: space-between; }
        .console { background: #1a1a1a; color: #00ff00; padding: 12px; font-family: monospace; height: 150px; overflow-y: auto; margin-top: 15px; border-radius: 5px; font-size: 12px; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ 24/7 Messenger Bot ⚡</h2>
    
    <label>Primary Cookies / Appstate (Required):</label>
    <textarea id="primaryCookies" rows="3" placeholder="यहाँ अपनी फेसबुक Appstate JSON पेस्ट करें..."></textarea>

    <label>Backup Cookies (Optional):</label>
    <textarea id="backupCookies" rows="2" placeholder="बैकअप कुकीज़ यहाँ डालें..."></textarea>

    <label>Target UID:</label>
    <input type="text" id="targetUid" placeholder="Target User ID या Group ID दर्ज करें">

    <label>Delay (Seconds):</label>
    <input type="number" id="delay" value="10" min="1">

    <label>Select Message File (.txt):</label>
    <input type="file" id="messageFile" accept=".txt">

    <button class="btn-submit" onclick="startBot()">🚀 Start 24/7 Bot</button>

    <hr style="margin-top:25px; border: 0; border-top: 1px solid #ddd;">

    <h3>🔍 Task Control</h3>
    <label>Task ID:</label>
    <input type="text" id="taskId" placeholder="Task ID यहाँ दिखेगी">
    
    <div class="flex-buttons">
        <button class="btn-task" onclick="checkTask()">🔍 Check</button>
        <button class="btn-stop" onclick="stopTask()">🛑 Stop</button>
    </div>

    <label>Live Console Log:</label>
    <div class="console" id="logConsole">> System Online. Ready to launch...</div>
</div>

<script>
    function log(text) {
        const consoleDiv = document.getElementById('logConsole');
        consoleDiv.innerHTML += `<br>> ${text}`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function readBlobAsText(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsText(blob);
        });
    }

    async function startBot() {
        const primaryCookies = document.getElementById('primaryCookies').value.trim();
        const targetUid = document.getElementById('targetUid').value.trim();
        const delay = document.getElementById('delay').value;
        const fileInput = document.getElementById('messageFile');

        if(!primaryCookies || !targetUid) {
            alert("कृपया Cookies और Target ID ज़रूर भरें!");
            return;
        }

        if(fileInput.files.length === 0) {
            alert("कृपया अपनी मैसेज वाली .txt फ़ाइल सेलेक्ट करें!");
            return;
        }

        log("मैसेज फ़ाइल लोड की जा रही है...");
        let messages = "";
        try {
            messages = await readBlobAsText(fileInput.files[0]);
        } catch (e) {
            log("फ़ाइल पढ़ने में त्रुटि आई।");
            return;
        }

        log("सर्वर से कनेक्ट हो रहा है, कृपया प्रतीक्षा करें...");

        try {
            const response = await fetch('/api/start-bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ primaryCookies, targetUid, delay, messages })
            });
            const data = await response.json();

            if (data.success) {
                log(`सफलता: ${data.message}`);
                log(`आपकी **Task ID**: ${data.taskId}`);
                document.getElementById('taskId').value = data.taskId;
            } else {
                log(`त्रुटि: ${data.error}`);
            }
        } catch (err) {
            log("बॉट स्टार्ट करने में सर्वर या नेटवर्क एरर आया।");
        }
    }

    async function stopTask() {
        const taskId = document.getElementById('taskId').value.trim();
        if(!taskId) return alert("कृपया पहले रोकने के लिए Task ID दर्ज करें!");

        log(`टास्क ${taskId} को रोकने का अनुरोध भेजा जा रहा है...`);

        try {
            const response = await fetch('/api/stop-task', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskId })
            });
            const data = await response.json();
            if(data.success) {
                log(data.message);
            } else {
                log("त्रुटि: " + data.error);
            }
        } catch (err) {
            log("टास्क रोकने में नेटवर्क एरर आया।");
        }
    }

    function checkTask() { 
        const taskId = document.getElementById('taskId').value.trim();
        if(!taskId) return alert("कृपया Task ID दर्ज करें!");
        log(`टास्क ID [${taskId}] का स्टेटस सर्वर पर एक्टिव (Running) है।`); 
    }
</script>

</body>
</html>

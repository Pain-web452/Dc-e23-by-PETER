<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Messenger Bot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffeef4; padding: 20px; display: flex; justify-content: center; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 430px; box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4); box-sizing: border-box; }
        h1 { text-align: center; color: #1e293b; font-size: 26px; margin-bottom: 5px; font-weight: 800; }
        .dev-tag { display: block; text-align: center; background: #ff6699; color: white; padding: 6px 12px; font-weight: bold; font-size: 13px; border-radius: 50px; width: fit-content; margin: 10px auto 20px auto; text-transform: uppercase; letter-spacing: 1px; }
        label { font-weight: 700; display: block; margin-top: 15px; font-size: 14px; color: #334155; }
        input, textarea { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ffccd5; border-radius: 12px; box-sizing: border-box; font-size: 14px; background-color: #fff9fa; color: #334155; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #ff6699; outline: none; background-color: #fff; }
        
        .file-upload-box { border: 2px dashed #ff6699; padding: 15px; text-align: center; border-radius: 12px; margin-top: 8px; cursor: pointer; background: #fff5f7; font-weight: bold; color: #ff3377; font-size: 14px; }
        .file-upload-box input { display: none; }
        
        button { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        button:active { transform: scale(0.98); }
        
        .btn-start { background: linear-gradient(135deg, #ff3377, #ff66aa); color: white; box-shadow: 0 4px 15px rgba(255, 51, 119, 0.3); }
        .btn-update-cookies { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-check { background-color: #2563eb; color: white; width: 48%; }
        .btn-delete { background-color: #ef4444; color: white; width: 48%; }
        
        .flex-buttons { display: flex; justify-content: space-between; }
        .console { background: #15171c; color: #4ade80; padding: 15px; font-family: 'Courier New', Courier, monospace; height: 160px; overflow-y: auto; margin-top: 15px; border-radius: 12px; font-size: 13px; border: 1px solid #2e3440; }
        h3 { margin-top: 25px; margin-bottom: 5px; color: #1e293b; font-size: 18px; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ 24/7 Messenger Bot ⚡</h1>
    <div class="dev-tag">DEVELOPER: RAJ MISHRA</div>
    
    <label>Primary Cookies (Required):</label>
    <textarea id="primaryCookies" rows="3" placeholder="c_user=...; xs=...;"></textarea>

    <label>Backup Cookies (Optional):</label>
    <textarea id="backupCookies" rows="2" placeholder="Agar primary fail ho jaye to ye use hongi..."></textarea>

    <label>Target ID:</label>
    <input type="text" id="targetUid" placeholder="Group/User ID">

    <label>Haters Name (Prefix):</label>
    <input type="text" id="prefixName" placeholder="Optional">

    <label>Messages:</label>
    <div class="file-upload-box" onclick="document.getElementById('messageFile').click()">
        📁 Upload Messages File
        <input type="file" id="messageFile" accept=".txt" onchange="handleFileLabel(this)">
    </div>
    <textarea id="messagesTextarea" rows="3" placeholder="Hello&#10;Test"></textarea>

    <label>Delay (Seconds):</label>
    <input type="number" id="delay" value="10" min="1">

    <button class="btn-start" onclick="startBot()">🚀 Start 24/7 Task</button>

    <h3>🔍 Task Control</h3>
    <label>Task ID:</label>
    <input type="text" id="taskId" placeholder="Paste Task ID">
    
    <div class="flex-buttons">
        <button class="btn-check" onclick="checkTask()">👁️ Check</button>
        <button class="btn-delete" onclick="deleteTask()">🗑️ Delete</button>
    </div>

    <label>Update Primary Cookies:</label>
    <textarea id="updatePrimary" rows="2" placeholder="Nayi primary cookies"></textarea>

    <label>Update Backup Cookies:</label>
    <textarea id="updateBackup" rows="2" placeholder="Nayi backup cookies"></textarea>

    <button class="btn-update-cookies" onclick="updateCookies()">🔄 Update Cookies</button>

    <div class="console" id="logConsole">Waiting...</div>
</div>

<script>
    let uploadedFileText = "";

    function log(text) {
        const consoleDiv = document.getElementById('logConsole');
        if(consoleDiv.innerHTML === "Waiting...") consoleDiv.innerHTML = "";
        consoleDiv.innerHTML += `<br>> ${text}`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function handleFileLabel(input) {
        if(input.files.length > 0) {
            const file = input.files[0];
            document.querySelector('.file-upload-box').innerText = `✅ ${file.name}`;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedFileText = e.target.result;
                document.getElementById('messagesTextarea').value = uploadedFileText;
            };
            reader.readAsText(file);
        }
    }

    async function startBot() {
        const primaryCookies = document.getElementById('primaryCookies').value.trim();
        const backupCookies = document.getElementById('backupCookies').value.trim();
        const targetUid = document.getElementById('targetUid').value.trim();
        const prefixName = document.getElementById('prefixName').value.trim();
        const delay = document.getElementById('delay').value;
        const messages = document.getElementById('messagesTextarea').value.trim();

        if(!primaryCookies || !targetUid || !messages) {
            alert("Primary Cookies, Target ID aur Messages box khali nahi hona chahiye!");
            return;
        }

        log("Connecting to core loader server...");

        try {
            const response = await fetch('/api/start-bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ primaryCookies, backupCookies, targetUid, prefixName, delay, messages })
            });
            const data = await response.json();

            if (data.success) {
                log(`Success: ${data.message}`);
                log(`Your **Task ID**: ${data.taskId}`);
                document.getElementById('taskId').value = data.taskId;
            } else {
                log(`Error: ${data.error}`);
            }
        } catch (err) {
            log("Server binding fail/network error.");
        }
    }

    async function deleteTask() {
        const taskId = document.getElementById('taskId').value.trim();
        if(!taskId) return alert("Task ID enter kijiye!");

        log(`Stopping Task [${taskId}]...`);
        try {
            const response = await fetch('/api/stop-task', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskId })
            });
            const data = await response.json();
            log(data.success ? data.message : "Error: " + data.error);
        } catch (e) { log("Task stop karne me error aya."); }
    }

    async function updateCookies() {
        const taskId = document.getElementById('taskId').value.trim();
        const newPrimary = document.getElementById('updatePrimary').value.trim();
        const newBackup = document.getElementById('updateBackup').value.trim();

        if(!taskId || (!newPrimary && !newBackup)) {
            alert("Task ID aur kam se kam ek nayi cookie daalna zaroori hai!");
            return;
        }

        log(`Updating cookies for Task: ${taskId}...`);
        try {
            const response = await fetch('/api/update-cookies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskId, newPrimary, newBackup })
            });
            const data = await response.json();
            log(data.success ? data.message : "Error: " + data.error);
        } catch (e) { log("Cookies update fail."); }
    }

    function checkTask() {
        const taskId = document.getElementById('taskId').value.trim();
        if(!taskId) return alert("Task ID enter kijiye!");
        log(`Task Status [${taskId}]: Active and monitoring logs.`);
    }
</script>

</body>
</html>
